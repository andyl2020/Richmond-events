name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/events-consolidation-ui-w5eia9]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement:true turns Pages on for the repo if it isn't already,
      # so this deploys without anyone touching repo settings first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Validate events.json
        run: |
          node -e "
            const d = require('./data/events.json');
            if (!Array.isArray(d.events) || !d.events.length) throw new Error('no events');
            const ids = d.events.map(e => e.id);
            const dupes = ids.filter((id, i) => ids.indexOf(id) !== i);
            if (dupes.length) throw new Error('duplicate ids: ' + dupes.join(', '));
            d.events.forEach(e => {
              if (!e.title || !e.kind) throw new Error('missing title/kind: ' + e.id);
              if (e.kind === 'dated' && !e.date) throw new Error('dated event without a date: ' + e.id);
              if (e.kind === 'recurring' && !e.recurrence) throw new Error('recurring event without a rule: ' + e.id);
            });
            console.log('events.json OK —', d.events.length, 'events');
          "

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
